# Fork-only: build our own image on every push to main.
# Upstream releases still come from release.yml on version tags; we do not
# push tags in this fork, so that workflow never runs here.
name: fork-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'dev-longshun/aws-quickwork-2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute version
        id: version
        run: |
          base="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          short="${GITHUB_SHA::7}"
          printf 'version=%s-ours+%s\nshort=%s\n' "$base" "$short" "$short" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/dev-longshun/aws-quickwork-2api:beta
            ghcr.io/dev-longshun/aws-quickwork-2api:sha-${{ steps.version.outputs.short }}
